[project]
name = "autonomous-code-review-agent"
version = "1.0.0"
description = "Autonomous Code Review & Refactoring Agent powered by LangGraph, FastAPI, and GitHub API"
readme = "README.md"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.black]
line-length = 88
target-version = ["py311", "py312", "py313"]
