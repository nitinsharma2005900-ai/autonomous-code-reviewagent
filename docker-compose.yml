services:
  code-review-agent:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: autonomous-code-review-agent
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - CHECKPOINTER_TYPE=sqlite
      - SQLITE_DB_PATH=/app/data/review_checkpoints.sqlite
    volumes:
      - checkpoint_data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  checkpoint_data:
